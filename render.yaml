services:
  - type: web
    name: college-financial-rag-demo
    runtime: python
    plan: free
    autoDeployTrigger: commit
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend && pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SECRET_KEY
        generateValue: true
